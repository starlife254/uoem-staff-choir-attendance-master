<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster & Announcement Studio | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b; --primary: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); height: 100vh; display: flex; overflow: hidden; }

    /* LEFT PANEL - Editor */
    .sidebar { width: 340px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; color: var(--primary); }
    .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; background: #f8fafc; }
    .form-control:focus { outline: none; border-color: var(--primary); background: #fff; }
    textarea.form-control { resize: vertical; min-height: 100px; }

    /* CENTER PANEL - Canvas */
    .workspace { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; background: #e2e8f0; }
    
    /* The Poster (1080x1080 scaled to 540x540 for preview) */
    #poster-canvas {
      width: 540px; height: 540px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      display: flex; flex-direction: column; position: relative; overflow: hidden; border-radius: 12px;
      transition: background 0.3s, color 0.3s;
      background: #1e293b; color: #ffffff; /* Default Theme */
    }

    /* THEME CLASSES */
    .theme-blue { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: #fff; }
    .theme-purple { background: linear-gradient(135deg, #4c1d95, #8b5cf6); color: #fff; }
    .theme-crimson { background: linear-gradient(135deg, #7f1d1d, #ef4444); color: #fff; }
    .theme-emerald { background: linear-gradient(135deg, #064e3b, #10b981); color: #fff; }
    .theme-dark { background: #0f172a; color: #f8fafc; }
    .theme-light { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; }

    /* POSTER CONTENT */
    .poster-inner { padding: 40px; display: flex; flex-direction: column; height: 100%; position: relative; z-index: 2; }
    .poster-header { text-align: center; margin-bottom: 20px; }
    .poster-badge { display: inline-block; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .theme-light .poster-badge { background: #f1f5f9; color: var(--primary); border-color: #e2e8f0; }
    
    .poster-title { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 700; line-height: 1.1; margin-bottom: 12px; }
    .poster-message { font-size: 16px; line-height: 1.6; opacity: 0.9; flex: 1; }
    
    .poster-footer { margin-top: auto; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
    .theme-light .poster-footer { border-top-color: #e2e8f0; }
    .poster-meta { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
    .poster-meta i { font-size: 18px; opacity: 0.8; }
    
    /* Decorative Shapes */
    .shape { position: absolute; z-index: 1; opacity: 0.1; }
    .shape-1 { width: 300px; height: 300px; border-radius: 50%; background: #fff; top: -100px; right: -100px; }
    .shape-2 { width: 200px; height: 200px; border-radius: 50%; background: #fff; bottom: -50px; left: -50px; }
    .theme-light .shape { background: #000; opacity: 0.03; }

    /* RIGHT PANEL - Export */
    .right-panel { width: 300px; background: var(--surface); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .btn { padding: 12px; border-radius: 8px; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
    .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
    .btn-success { background: #10b981; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }

    /* Theme Selector */
    .theme-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .theme-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn.active { border-color: #fff; box-shadow: 0 0 0 2px var(--primary); }
    .t-blue { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
    .t-purple { background: linear-gradient(135deg, #4c1d95, #8b5cf6); }
    .t-crimson { background: linear-gradient(135deg, #7f1d1d, #ef4444); }
    .t-emerald { background: linear-gradient(135deg, #064e3b, #10b981); }
    .t-dark { background: #0f172a; }
    .t-light { background: #ffffff; border: 1px solid #cbd5e1; }

    /* History List */
    .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .history-item { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .history-item:hover { background: #f8fafc; }
    .history-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
    .history-info { flex: 1; overflow: hidden; }
    .history-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @media (max-width: 1024px) {
      body { flex-direction: column; height: auto; overflow: auto; }
      .sidebar, .right-panel { width: 100%; border: none; border-bottom: 1px solid var(--border); }
      #poster-canvas { width: 100%; max-width: 540px; height: auto; aspect-ratio: 1/1; }
      .workspace { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- LEFT: EDITOR CONTROLS -->
  <aside class="sidebar">
    <div class="sidebar-header"><i class="ti ti-palette"></i> Poster Editor</div>
    <div class="sidebar-content">
      
      <div class="form-group">
        <label>Badge / Category</label>
        <input type="text" class="form-control" id="inputBadge" value="Important Notice" onkeyup="updatePreview()">
      </div>

      <div class="form-group">
        <label>Main Heading</label>
        <input type="text" class="form-control" id="inputTitle" value="Friday Rehearsal" onkeyup="updatePreview()">
      </div>

      <div class="form-group">
        <label>Message / Body</label>
        <textarea class="form-control" id="inputMessage" onkeyup="updatePreview()">All members are reminded to attend the upcoming rehearsal. We will be preparing for the university event. Please be on time.</textarea>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="text" class="form-control" id="inputDate" value="Friday, 27th November 2026" onkeyup="updatePreview()">
      </div>

      <div class="form-group">
        <label>Time & Venue</label>
        <input type="text" class="form-control" id="inputVenue" value="5:00 PM | Tuition Block" onkeyup="updatePreview()">
      </div>

    </div>
  </aside>

  <!-- CENTER: CANVAS -->
  <main class="workspace">
    <div id="poster-canvas" class="theme-blue">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      
      <div class="poster-inner">
        <div class="poster-header">
          <span class="poster-badge" id="badgePreview">Important Notice</span>
          <h1 class="poster-title" id="titlePreview">Friday Rehearsal</h1>
        </div>
        
        <div class="poster-message" id="messagePreview">
          All members are reminded to attend the upcoming rehearsal. We will be preparing for the university event. Please be on time.
        </div>
        
        <div class="poster-footer">
          <div class="poster-meta">
            <i class="ti ti-calendar-event"></i>
            <span id="datePreview">Friday, 27th November 2026</span>
          </div>
          <div class="poster-meta">
            <i class="ti ti-map-pin"></i>
            <span id="venuePreview">5:00 PM | Tuition Block</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- RIGHT: EXPORT & THEMES -->
  <aside class="right-panel">
    <div>
      <label style="font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;">Color Theme</label>
      <div class="theme-grid" style="margin-top: 8px;">
        <div class="theme-btn t-blue active" onclick="setTheme('theme-blue', this)"></div>
        <div class="theme-btn t-purple" onclick="setTheme('theme-purple', this)"></div>
        <div class="theme-btn t-crimson" onclick="setTheme('theme-crimson', this)"></div>
        <div class="theme-btn t-emerald" onclick="setTheme('theme-emerald', this)"></div>
        <div class="theme-btn t-dark" onclick="setTheme('theme-dark', this)"></div>
        <div class="theme-btn t-light" onclick="setTheme('theme-light', this)"></div>
      </div>
    </div>

    <hr style="border: none; border-top: 1px solid var(--border); margin: 8px 0;">

    <button class="btn btn-primary" onclick="downloadPoster()">
      <i class="ti ti-download"></i> Download Image (PNG)
    </button>

    <button class="btn btn-outline" onclick="saveToHistory()">
      <i class="ti ti-device-floppy"></i> Save to History
    </button>

    <hr style="border: none; border-top: 1px solid var(--border); margin: 8px 0;">

    <div>
      <label style="font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;">Recent Posters</label>
      <div id="historyContainer" class="history-list">
        <!-- History loads here -->
      </div>
    </div>
  </aside>

  <script>
    let currentTheme = 'theme-blue';

    // Live update preview
    function updatePreview() {
      document.getElementById('badgePreview').innerText = document.getElementById('inputBadge').value || 'Notice';
      document.getElementById('titlePreview').innerText = document.getElementById('inputTitle').value || 'Title';
      document.getElementById('messagePreview').innerText = document.getElementById('inputMessage').value || 'Message goes here...';
      document.getElementById('datePreview').innerText = document.getElementById('inputDate').value || 'Date';
      document.getElementById('venuePreview').innerText = document.getElementById('inputVenue').value || 'Time & Venue';
    }

    // Change Theme
    function setTheme(themeClass, btnElement) {
      const canvas = document.getElementById('poster-canvas');
      // Remove old themes
      canvas.className = ''; 
      // Add new theme
      canvas.classList.add(themeClass);
      currentTheme = themeClass;

      // Update active button UI
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    // Download Image
    async function downloadPoster() {
      const canvas = document.getElementById('poster-canvas');
      const btn = event.target.closest('button');
      const original = btn.innerHTML;
      
      btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Generating...';
      
      try {
        // Capture the canvas
        const canvasResult = await html2canvas(canvas, {
          scale: 2, // High resolution
          backgroundColor: null,
          useCORS: true
        });
        
        // Create download link
        const link = document.createElement('a');
        link.download = `Choir_Poster_${Date.now()}.png`;
        link.href = canvasResult.toDataURL('image/png');
        link.click();
        
      } catch (err) {
        alert('Failed to download: ' + err.message);
      } finally {
        btn.innerHTML = original;
      }
    }

    // Save to History
    async function saveToHistory() {
      const btn = event.target.closest('button');
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite;"></i> Saving...';
      btn.disabled = true;

      try {
        const canvas = document.getElementById('poster-canvas');
        const canvasResult = await html2canvas(canvas, { scale: 2, backgroundColor: null });
        
        canvasResult.toBlob(async (blob) => {
          const formData = new FormData();
          formData.append('file', blob, 'poster.png');
          formData.append('upload_preset', 'uoem_choir_uploads');

          const response = await fetch('https://api.cloudinary.com/v1_1/surgtbdr/image/upload', {
            method: 'POST',
            body: formData
          });
          const cloudData = await response.json();

          if (cloudData.error) throw new Error(cloudData.error.message);

          const { error } = await sb.from('admin_publications').insert({
            title: document.getElementById('inputTitle').value,
            category: 'Poster',
            image_url: cloudData.secure_url,
            created_by: 'Admin'
          });

          if (error) throw error;
          
          alert('✅ Poster saved to history!');
          loadHistory(); // Refresh list
          
        }, 'image/png');
      } catch (err) {
        alert('❌ Save Failed: ' + err.message);
      } finally {
        btn.innerHTML = original;
        btn.disabled = false;
      }
    }

    // Load History (Only Posters)
    async function loadHistory() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '<p style="font-size:12px; color:#64748b; text-align:center;">Loading...</p>';

      const { data, error } = await sb.from('admin_publications')
        .select('*')
        .eq('category', 'Poster')
        .order('created_at', { ascending: false })
        .limit(5);

      if (error || !data.length) {
        container.innerHTML = '<p style="font-size:12px; color:#64748b; text-align:center;">No posters saved yet.</p>';
        return;
      }

      container.innerHTML = data.map(p => `
        <div class="history-item" onclick="window.open('${p.image_url}', '_blank')">
          <img src="${p.image_url}" alt="${p.title}">
          <div class="history-info">
            <div class="history-title">${p.title}</div>
            <div style="font-size:10px; color:#64748b;">${new Date(p.created_at).toLocaleDateString()}</div>
          </div>
        </div>
      `).join('');
    }

    // Init
    window.addEventListener('load', loadHistory);
  </script>
</body>
</html>
