<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Staff Choir</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
  --green:#10b981;--red:#ef4444;
  --surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,sans-serif;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#3b82f6 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;
}
.card{
  background:var(--surface);width:100%;max-width:420px;border-radius:20px;
  padding:40px 32px;box-shadow:0 25px 50px rgba(0,0,0,.25);
}
.logo{
  width:64px;height:64px;border-radius:16px;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  color:var(--primary);font-size:32px;
}
h1{font-size:22px;text-align:center;color:var(--text);margin-bottom:6px;font-weight:700}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:28px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-family:inherit;transition:.15s;margin-bottom:16px;
}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
button{
  width:100%;padding:13px;background:var(--primary);color:#fff;border:none;
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;
}
button:hover{background:var(--primary-dark)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5}
.msg.err{background:#fee2e2;color:#991b1b;display:block;border-left:3px solid var(--red)}
.msg.ok{background:#d1fae5;color:#065f46;display:block;border-left:3px solid var(--green)}
.hint{font-size:11.5px;color:var(--muted);margin-top:-10px;margin-bottom:14px;display:block}
.info{
  background:var(--primary-light);border-left:3px solid var(--primary);
  padding:11px 14px;border-radius:9px;font-size:13px;color:var(--primary-dark);
  margin-bottom:20px;line-height:1.5;
}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="logo"><i class="ti ti-lock-open"></i></div>
  <h1>Set a New Password</h1>
  <p class="sub">Your password was reset by an admin. Please choose your own.</p>

  <div class="info">
    <i class="ti ti-info-circle"></i>
    You signed in with the default password. Set your own to continue.
  </div>

  <div class="msg" id="msg"></div>

  <label>New Password</label>
  <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
  <span class="hint">Minimum 6 characters</span>

  <label>Confirm New Password</label>
  <input type="password" id="confirm" required minlength="6" placeholder="Re-enter your new password" autocomplete="new-password">

  <button type="submit" id="btn">
    <i class="ti ti-check"></i> Save New Password
  </button>
</form>

<script>
const $ = s => document.querySelector(s);
const msg = $("#msg");
const btn = $("#btn");

function show(text, cls = "err") {
  msg.textContent = text;
  msg.className = "msg " + cls;
}

// Require an active session — user just logged in with the default password
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    show("Please sign in first.", "err");
    setTimeout(() => location.href = "../login.html", 1200);
    btn.disabled = true;
  }
})();

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "msg";

  const pw = $("#password").value;
  const confirm = $("#confirm").value;

  if (pw.length < 6) return show("Password must be at least 6 characters");
  if (pw === "UOEMCHOIR") return show("Please choose a password different from the default");
  if (pw !== confirm) return show("Passwords do not match");

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader"></i> Saving…';

  try {
    // 1. Update the password via Supabase auth
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;

    // 2. Clear the must_change_password flag on their member record
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user?.email) {
      await sb.from('members')
        .update({ must_change_password: false, updated_at: new Date().toISOString() })
        .eq('email', session.user.email);
    }

    show("✓ Password updated! Redirecting to your dashboard…", "ok");
    btn.innerHTML = '<i class="ti ti-check"></i> Done';
    setTimeout(() => location.href = "dashboard.html", 1400);
  } catch (err) {
    show(err.message || "Could not update password");
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-check"></i> Save New Password';
  }
});
</script>
</body>
</html>
