<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password — Staff Choir</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#1e3a8a,#2563eb);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:0}
.card{background:#fff;border-radius:20px;padding:36px 30px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,.25)}
h1{font-size:20px;text-align:center;margin:0 0 6px}
p.sub{text-align:center;color:#64748b;font-size:13px;margin:0 0 24px}
label{font-size:12px;font-weight:600;color:#334155;display:block;margin-bottom:4px}
input{width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:9px;font-family:inherit;font-size:13px;margin-bottom:14px;box-sizing:border-box}
input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
button:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.msg.err{background:#fee2e2;color:#991b1b;display:block}
.msg.ok{background:#d1fae5;color:#065f46;display:block}
a{color:#2563eb;font-weight:600;text-decoration:none}
.foot{text-align:center;margin-top:16px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<form class="card" id="form">
  <h1>Reset Password</h1>
  <p class="sub">We'll email you a secure reset link</p>
  <div class="msg" id="msg"></div>
  <label>Your Email</label>
  <input type="email" id="email" required placeholder="you@embuni.ac.ke">
  <button type="submit" id="btn">Send Reset Link</button>
  <p class="foot"><a href="../login.html">← Back to login</a></p>
</form>
<script>
const $ = s => document.querySelector(s);
$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#email").value.trim();
  const msg = $("#msg");
  const btn = $("#btn");
  btn.disabled = true; btn.textContent = "Sending…";
  msg.className = "msg";
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/member/dashboard.html"
    });
    if (error) throw error;
    msg.textContent = "✓ Reset link sent! Check your email.";
    msg.className = "msg ok";
  } catch (err) {
    msg.textContent = err.message || "Failed to send reset link";
    msg.className = "msg err";
  } finally {
    btn.disabled = false; btn.textContent = "Send Reset Link";
  }
});
</script>
</body>
</html>
